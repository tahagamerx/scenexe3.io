<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Scenexe2 | Final Playable Build</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap');
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Ubuntu', sans-serif; color: white; user-select: none; }
        canvas { display: block; }

        /* Scenexe2 Authentic UI (Referencing 4.PNG & asd3.PNG) */
        .ui-panel { position: absolute; bottom: 25px; width: 280px; z-index: 100; pointer-events: none; }
        #left-ui { left: 25px; }
        #right-ui { right: 25px; }

        .stat-bar { 
            background: rgba(0, 0, 0, 0.95); border: 2.5px solid #333; border-radius: 35px;
            margin: 8px 0; padding: 10px 20px; display: flex; justify-content: space-between;
            align-items: center; cursor: pointer; pointer-events: auto; transition: 0.15s;
        }
        .stat-bar:hover { border-color: #00adef; background: #080808; transform: translateX(5px); }
        #right-ui .stat-bar:hover { transform: translateX(-5px); }

        .stat-label { display: flex; align-items: center; gap: 12px; }
        .stat-name { font-weight: 700; font-size: 15px; letter-spacing: 0.5px; }
        .stat-key { color: #555; font-size: 12px; font-weight: 700; }
        .stat-val { color: #00adef; font-weight: 900; font-size: 18px; font-family: monospace; }

        /* Central HUD (Level, Score, XP) */
        #central-hud { 
            position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            width: 550px; text-align: center; pointer-events: none;
        }
        .name-tag { font-size: 28px; font-weight: 900; letter-spacing: 1px; margin-bottom: 2px; }
        .sub-tag { font-size: 13px; color: #888; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 3px; font-weight: 700; }
        .bar-wrap { width: 100%; height: 14px; background: #111; border: 2.5px solid #333; border-radius: 20px; overflow: hidden; }
        #xp-fill { width: 0%; height: 100%; background: #00adef; box-shadow: 0 0 20px rgba(0, 173, 239, 0.7); transition: width 0.4s cubic-bezier(0.1, 0.7, 1.0, 0.1); }
        .score-info { margin-top: 10px; font-size: 14px; font-weight: 700; color: #eee; }

        /* Minimap & HUD Info */
        #minimap { position: absolute; top: 20px; left: 20px; width: 150px; height: 150px; background: rgba(20, 20, 20, 0.8); border: 2px solid #333; border-radius: 5px; }
        #top-right { position: absolute; top: 20px; right: 25px; text-align: right; font-family: monospace; font-size: 13px; color: #555; }
        .active-mod { color: #00adef; font-weight: bold; text-shadow: 0 0 8px #00adef; }
    </style>
</head>
<body>

    <div id="top-right">
        AUTO-FIRE [E]: <span id="e-status">OFF</span> | 
        PASSIVE [V]: <span id="v-status">OFF</span> | 
        SPIN [C]: <span id="c-status">OFF</span>
    </div>

    <div id="left-ui" class="ui-panel">
        <div class="stat-bar" onclick="lvlUp('reload')"><div class="stat-label"><span class="stat-key">[1]</span><span class="stat-name">Reload</span></div><span class="stat-val" id="val-reload">0</span></div>
        <div class="stat-bar" onclick="lvlUp('damage')"><div class="stat-label"><span class="stat-key">[2]</span><span class="stat-name">Damage</span></div><span class="stat-val" id="val-damage">0</span></div>
        <div class="stat-bar" onclick="lvlUp('bSpeed')"><div class="stat-label"><span class="stat-key">[3]</span><span class="stat-name">Bullet Speed</span></div><span class="stat-val" id="val-bSpeed">0</span></div>
        <div class="stat-bar" onclick="lvlUp('bHealth')"><div class="stat-label"><span class="stat-key">[4]</span><span class="stat-name">Bullet Health</span></div><span class="stat-val" id="val-bHealth">0</span></div>
    </div>

    <div id="right-ui" class="ui-panel">
        <div class="stat-bar" onclick="lvlUp('maxHP')"><span class="stat-val" id="val-maxHP">0</span><div class="stat-label"><span class="stat-name">Max Health</span><span class="stat-key">[5]</span></div></div>
        <div class="stat-bar" onclick="lvlUp('regen')"><span class="stat-val" id="val-regen">0</span><div class="stat-label"><span class="stat-name">Regeneration</span><span class="stat-key">[6]</span></div></div>
        <div class="stat-bar" onclick="lvlUp('bodyDmg')"><span class="stat-val" id="val-bodyDmg">0</span><div class="stat-label"><span class="stat-name">Body Damage</span><span class="stat-key">[7]</span></div></div>
        <div class="stat-bar" onclick="lvlUp('speed')"><span class="stat-val" id="val-speed">0</span><div class="stat-label"><span class="stat-name">Movement</span><span class="stat-key">[8]</span></div></div>
    </div>

    <div id="central-hud">
        <div class="name-tag">Unnamed</div>
        <div class="sub-tag">Level <span id="ui-level">1</span> <span id="ui-class">Mono-Sentry</span></div>
        <div class="bar-wrap"><div id="xp-fill"></div></div>
        <div class="score-info">SCORE: <span id="ui-score">0</span> | POINTS: <span id="ui-pts">0</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let shapes = [], bullets = [], portals = [], particles = [], keys = {}, camScale = 1;

        // Realistic Scenexe2 Player Object
        let p = {
            x: 0, y: 0, vx: 0, vy: 0, angle: 0,
            lvl: 1, xp: 0, next: 100, score: 0, pts: 0,
            hp: 100, maxHP: 100,
            stats: { reload:0, damage:0, bSpeed:0, bHealth:0, maxHP:0, regen:0, bodyDmg:0, speed:0 },
            barrels: 1, bWidth: 28, bLen: 55, type: 'Mono-Sentry', 
            autoF: false, passive: false, autoS: false, cooldown: 0
        };

        function init() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            for(let i=0; i<350; i++) spawnShape();
            portals.push({x: 3000, y: 3000, c: '#9c27b0', label: 'The Void'});
            requestAnimationFrame(loop);
        }

        function spawnShape() {
            let r = Math.random();
            let sides = (r > 0.98) ? 6 : (r > 0.9) ? 5 : (r > 0.7) ? 4 : 3;
            shapes.push({
                x: (Math.random()-0.5)*12000, y: (Math.random()-0.5)*12000,
                size: 25 + (sides*6), sides: sides, 
                hp: sides*60, maxHP: sides*60, xp: sides*80,
                color: (sides==6?'#ff00ff':sides==5?'#768dfc':sides==4?'#ff8a8a':'#ffe869'),
                angle: Math.random()*7, spin: (Math.random()-0.5)*0.04
            });
        }

        function lvlUp(s) {
            if(p.pts > 0 && p.stats[s] < 15) {
                p.stats[s]++; p.pts--;
                document.getElementById(`val-${s}`).innerText = p.stats[s];
                document.getElementById('ui-pts').innerText = p.pts;
                if(s === 'maxHP') { p.maxHP += 60; p.hp += 60; }
            }
        }

        window.onkeydown = e => {
            let k = e.key.toLowerCase(); keys[k] = true;
            if(k === 'e') { p.autoF = !p.autoF; document.getElementById('e-status').className = p.autoF ? 'active-mod' : ''; document.getElementById('e-status').innerText = p.autoF ? 'ON' : 'OFF'; }
            if(k === 'v') { p.passive = !p.passive; document.getElementById('v-status').className = p.passive ? 'active-mod' : ''; document.getElementById('v-status').innerText = p.passive ? 'ON' : 'OFF'; }
            if(k === 'c') { p.autoS = !p.autoS; document.getElementById('c-status').className = p.autoS ? 'active-mod' : ''; document.getElementById('c-status').innerText = p.autoS ? 'ON' : 'OFF'; }
            const map = {'1':'reload','2':'damage','3':'bSpeed','4':'bHealth','5':'maxHP','6':'regen','7':'bodyDmg','8':'speed'};
            if(map[e.key]) lvlUp(map[e.key]);
        };
        window.onkeyup = e => keys[e.key.toLowerCase()] = false;
        window.onmousemove = e => p.angle = Math.atan2(e.clientY - canvas.height/2, e.clientX - canvas.width/2);
        window.onmousedown = () => window.isFiring = true;
        window.onmouseup = () => window.isFiring = false;

        function update() {
            // Smooth Physics & Recoil
            let acc = 0.65 + (p.stats.speed * 0.12);
            if(keys['w']) p.vy -= acc; if(keys['s']) p.vy += acc;
            if(keys['a']) p.vx -= acc; if(keys['d']) p.vx += acc;
            p.vx *= 0.92; p.vy *= 0.92; p.x += p.vx; p.y += p.vy;

            if(p.autoS) p.angle += 0.05;

            // FOV Expansion (Scenexe2 Style)
            let targetZoom = 0.85 / (1 + (p.lvl * 0.018));
            if(p.type === 'Sniper') targetZoom *= 0.7; // Snipers see much further
            camScale += (targetZoom - camScale) * 0.04;

            // Combat & Evolution
            if(!p.passive && (p.autoF || window.isFiring) && p.cooldown <= 0) {
                for(let i=0; i<p.barrels; i++) {
                    bullets.push({
                        x: p.x, y: p.y, angle: p.angle + (i-(p.barrels-1)/2)*0.18, 
                        life: 90 + (p.stats.bHealth*6), dmg: 30 + (p.stats.damage*12)
                    });
                    // Scenexe2 Recoil
                    p.vx -= Math.cos(p.angle) * 0.3; p.vy -= Math.sin(p.angle) * 0.3;
                }
                p.cooldown = 24 - (p.stats.reload * 1.4);
            }
            if(p.cooldown > 0) p.cooldown--;

            // Bullets & Shapes Interaction
            bullets.forEach((b, bi) => {
                let bs = 16 + (p.stats.bSpeed * 1.8);
                b.x += Math.cos(b.angle)*bs; b.y += Math.sin(b.angle)*bs;
                shapes.forEach((s, si) => {
                    if(Math.hypot(b.x-s.x, b.y-s.y) < s.size) {
                        s.hp -= b.dmg; b.life = 0;
                        if(s.hp <= 0) {
                            p.score += s.xp * 2.5; p.xp += s.xp;
                            shapes.splice(si, 1); spawnShape();
                            if(p.xp >= p.next) {
                                p.lvl++; p.pts++; p.xp = 0; p.next *= 1.38;
                                // Evolution Tree
                                if(p.lvl == 15) { p.barrels = 2; p.type = "Twin"; }
                                if(p.lvl == 30) { p.barrels = 1; p.type = "Sniper"; p.bLen = 95; p.bWidth = 32; }
                                if(p.lvl == 45) { p.barrels = 3; p.type = "Triple-Threat"; p.bLen = 65; }
                            }
                        }
                    }
                });
                if(b.life-- <= 0) bullets.splice(bi, 1);
            });

            // UI Sync
            document.getElementById('xp-fill').style.width = (p.xp/p.next*100) + "%";
            document.getElementById('ui-level').innerText = p.lvl;
            document.getElementById('ui-score').innerText = Math.floor(p.score);
            document.getElementById('ui-class').innerText = p.type;
        }

        function loop() {
            update();
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            ctx.clearRect(0,0,canvas.width,canvas.height);
            
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2);
            ctx.scale(camScale, camScale);
            ctx.translate(-p.x, -p.y);

            // Scenexe2 Dark Grid
            ctx.strokeStyle = '#121212'; ctx.lineWidth = 3;
            const gridSize = 160;
            for(let i = -6000; i <= 6000; i += gridSize) {
                ctx.beginPath(); ctx.moveTo(i, -6000); ctx.lineTo(i, 6000); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(-6000, i); ctx.lineTo(6000, i); ctx.stroke();
            }

            // Dimensions Portals
            portals.forEach(pt => {
                ctx.shadowBlur = 40; ctx.shadowColor = pt.c;
                ctx.fillStyle = pt.c; ctx.beginPath(); ctx.arc(pt.x, pt.y, 100, 0, 7); ctx.fill();
                ctx.shadowBlur = 0;
            });

            // Shapes with Thick Outlines
            shapes.forEach(s => {
                ctx.fillStyle = s.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 7;
                ctx.beginPath();
                for(let i=0; i<s.sides; i++) {
                    ctx.lineTo(s.x + Math.cos(s.angle + i*Math.PI*2/s.sides)*s.size, s.y + Math.sin(s.angle + i*Math.PI*2/s.sides)*s.size);
                }
                ctx.closePath(); ctx.fill(); ctx.stroke();
                s.angle += s.spin;
            });

            // High-Resolution Bullets
            ctx.fillStyle = p.color; ctx.strokeStyle = '#000'; ctx.lineWidth = 5;
            bullets.forEach(b => {
                ctx.beginPath(); ctx.arc(b.x, b.y, 11, 0, 7); ctx.fill(); ctx.stroke();
            });

            // Master Tank Rendering
            ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.angle);
            ctx.fillStyle = '#333'; ctx.strokeStyle = '#000'; ctx.lineWidth = 6;
            for(let i=0; i<p.barrels; i++) {
                ctx.save(); ctx.rotate((i-(p.barrels-1)/2)*0.18);
                ctx.fillRect(0, -p.bWidth/2, p.bLen, p.bWidth); 
                ctx.strokeRect(0, -p.bWidth/2, p.bLen, p.bWidth);
                ctx.restore();
            }
            ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(0,0,26,0,7); ctx.fill(); ctx.stroke();
            ctx.restore();

            ctx.restore();
            requestAnimationFrame(loop);
        }

        init();
        window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
    </script>
</body>
</html>
